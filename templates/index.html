<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政区划查询</title>
    <meta name="description" content="行政区划代码查询，支持自适应级联选择">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #22c55e;
            --primary-bg: #f0fdf4;
            --primary-bg-strong: #dcfce7;
            --ring: rgba(22, 163, 74, 0.15);
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(16, 24, 40, 0.05);
            --shadow-md: 0 4px 8px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.04);
            --shadow-lg: 0 12px 24px -4px rgba(16, 24, 40, 0.12), 0 4px 8px -4px rgba(16, 24, 40, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg-color);
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 44px 32px;
            box-shadow: 0 20px 50px -12px rgba(16, 24, 40, 0.12), 0 4px 12px rgba(16, 24, 40, 0.04);
            max-width: 960px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .logo {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
            flex-shrink: 0;
        }

        .logo svg {
            width: 26px;
            height: 26px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 400;
            margin-top: 12px;
        }

        .selector-section {
            margin-bottom: 24px;
        }

        .selector-container {
            display: grid;
            /* 列数跟随当前级联层级数：1级1列、3级3列、4级4列 */
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 20px;
        }

        .select-wrapper {
            position: relative;
            animation: fadeInUp 0.4s ease-out backwards;
        }

        .select-wrapper:nth-child(1) { animation-delay: 0.05s; }
        .select-wrapper:nth-child(2) { animation-delay: 0.1s; }
        .select-wrapper:nth-child(3) { animation-delay: 0.15s; }
        .select-wrapper:nth-child(4) { animation-delay: 0.2s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .select-wrapper.hidden {
            display: none;
        }

        .select-wrapper label {
            display: block;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .select-container {
            position: relative;
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        .select-arrow svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        /* Result Panel */
        .result-panel {
            background: var(--primary-bg);
            border-radius: 14px;
            padding: 22px 26px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .result-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .result-icon svg {
            width: 22px;
            height: 22px;
        }

        .result-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .result-divider {
            width: 1px;
            height: 22px;
            background: #c6dcc9;
            margin: 0 6px;
            flex-shrink: 0;
        }

        .result-path {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .path-entry {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            animation: fadeIn 0.3s ease-out backwards;
        }

        .path-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: #374151;
            white-space: nowrap;
        }

        .type-tag {
            background: var(--primary-bg-strong);
            color: var(--primary);
            padding: 2px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .path-arrow {
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .path-arrow svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .code-section {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .code-label {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .result-code {
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            background: var(--primary-bg-strong);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .copy-btn {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #374151;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            border-color: #d1d5db;
            box-shadow: var(--shadow-md);
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .copy-btn.copied {
            color: var(--primary);
            border-color: var(--primary-bg-strong);
            background: var(--primary-bg);
        }

        /* Stats Section */
        .stats-section {
            display: flex;
            align-items: stretch;
            border-top: 1px solid var(--border);
            margin-top: 28px;
            padding-top: 26px;
        }

        .stat-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 2px 22px;
            min-width: 0;
        }

        .stat-item:first-child {
            padding-left: 4px;
        }

        .stat-item:last-child {
            padding-right: 4px;
        }

        .stat-item + .stat-item {
            border-left: 1px solid var(--border);
        }

        .stat-icon {
            color: var(--primary);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .stat-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            white-space: nowrap;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
        }

        .footer-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s ease;
        }

        .footer-link svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .footer-link:hover {
            color: var(--primary-dark);
        }

        /* Custom Searchable Select Component */
        .custom-select {
            position: relative;
            width: 100%;
        }

        .custom-select-trigger {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            min-height: 46px;
        }

        .custom-select-trigger:hover {
            border-color: #d1d5db;
            box-shadow: var(--shadow-md);
        }

        .custom-select-trigger:hover .custom-select-arrow svg {
            stroke: var(--primary);
        }

        .custom-select.open .custom-select-trigger {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .custom-select.open .custom-select-arrow {
            transform: rotate(180deg);
        }

        .custom-select.open .custom-select-arrow svg {
            stroke: var(--primary);
        }

        .custom-select-trigger.disabled {
            background-color: #f9fafb;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .custom-select-placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .custom-select-arrow {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .custom-select-arrow svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .custom-select.open .custom-select-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-select-search {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .custom-select-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-select-search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        .custom-select-search-input::placeholder {
            color: var(--text-muted);
        }

        .custom-select-options {
            max-height: 240px;
            overflow-y: auto;
            padding: 6px;
        }

        .custom-select-options::-webkit-scrollbar {
            width: 6px;
        }

        .custom-select-options::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-select-options::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }

        .custom-select-options::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .custom-select-option {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .custom-select-option:hover {
            background: #f5f5f5;
        }

        .custom-select-option.highlighted {
            background: var(--primary-bg);
        }

        .custom-select-option.selected {
            background: var(--primary);
            color: #fff;
        }

        .custom-select-option-type {
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(22, 163, 74, 0.12);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }

        .custom-select-option.selected .custom-select-option-type {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .custom-select-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .custom-select-empty-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .custom-select-loading {
            padding: 20px;
            text-align: center;
        }

        .custom-select-loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .custom-select-loading-text {
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .custom-select-trigger.loading {
            position: relative;
            overflow: hidden;
        }

        .custom-select-trigger.loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(22, 163, 74, 0.08), transparent);
            animation: shimmer-loading 1.5s infinite;
        }

        @keyframes shimmer-loading {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-highlight {
            background: rgba(22, 163, 74, 0.25);
            border-radius: 2px;
            padding: 0 1px;
        }

        .custom-select-option.selected .search-highlight {
            background: rgba(255, 255, 255, 0.35);
        }

        @media (max-width: 768px) {
            .container {
                padding: 28px 24px 24px;
                border-radius: 20px;
            }

            .title {
                font-size: 1.5rem;
            }

            .logo {
                width: 46px;
                height: 46px;
                border-radius: 12px;
            }

            .logo svg {
                width: 23px;
                height: 23px;
            }

            .header {
                margin-bottom: 24px;
            }

            .selector-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .result-panel {
                padding: 20px;
            }

            .stats-section {
                flex-direction: column;
                padding-top: 6px;
            }

            .stat-item,
            .stat-item:first-child,
            .stat-item:last-child {
                padding: 14px 4px;
            }

            .stat-item + .stat-item {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 24px 18px 20px;
            }

            .result-divider {
                display: none;
            }

            .result-code {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/>
                        <path d="M15 5.764v15"/>
                        <path d="M9 3.236v15"/>
                    </svg>
                </div>
                <h1 class="title">行政区划查询</h1>
            </div>
            <p class="subtitle">自适应级联选择 · 支持省 / 市 / 区县 / 乡镇街道</p>
        </header>

        <section class="selector-section">
            <div class="selector-container" id="selectorContainer">
                <!-- 动态生成选择器 -->
            </div>
        </section>

        <section class="result-panel" id="resultPanel" style="display: none;">
            <div class="result-header">
                <span class="result-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" fill="currentColor"/>
                        <circle cx="12" cy="10" r="3" fill="#fff"/>
                    </svg>
                </span>
                <span class="result-title">已选择区划</span>
                <span class="result-divider"></span>
                <div class="result-path" id="resultPath"></div>
            </div>
            <div class="code-section">
                <span class="code-label">区划代码</span>
                <span class="result-code" id="resultCode"></span>
                <button class="copy-btn" id="copyBtn" title="复制代码">
                    <svg viewBox="0 0 24 24">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                    </svg>
                    <span>复制</span>
                </button>
            </div>
        </section>

        <section class="stats-section" id="statsSection">
            <div class="stat-item">
                <span class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/>
                        <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>
                        <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
                    </svg>
                </span>
                <div class="stat-info">
                    <div class="stat-number" id="statTotal">--</div>
                    <div class="stat-label">总计区划</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <line x1="3" x2="21" y1="22" y2="22"/>
                        <line x1="6" x2="6" y1="18" y2="11"/>
                        <line x1="10" x2="10" y1="18" y2="11"/>
                        <line x1="14" x2="14" y1="18" y2="11"/>
                        <line x1="18" x2="18" y1="18" y2="11"/>
                        <polygon points="12 2 20 7 4 7"/>
                    </svg>
                </span>
                <div class="stat-info">
                    <div class="stat-number" id="statLevel1">--</div>
                    <div class="stat-label">省级</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
                        <path d="M6 12H4a2 2 0 0 0-2 2v8h4"/>
                        <path d="M18 9h2a2 2 0 0 1 2 2v11h-4"/>
                        <path d="M10 6h4"/>
                        <path d="M10 10h4"/>
                        <path d="M10 14h4"/>
                        <path d="M10 18h4"/>
                    </svg>
                </span>
                <div class="stat-info">
                    <div class="stat-number" id="statLevel2">--</div>
                    <div class="stat-label">地级</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </span>
                <div class="stat-info">
                    <div class="stat-number" id="statLevel3">--</div>
                    <div class="stat-label">县级</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/>
                    </svg>
                </span>
                <div class="stat-info">
                    <div class="stat-number" id="statLevel4">--</div>
                    <div class="stat-label">乡级</div>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p class="footer-text">数据来源：国家地名信息库 · <a href="https://github.com/slightlee/regions_data" class="footer-link" target="_blank">开源项目
                <svg viewBox="0 0 24 24">
                    <path d="M15 3h6v6"/>
                    <path d="M10 14 21 3"/>
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                </svg>
            </a></p>
        </footer>
    </div>

    <script>
        // 存储选择的数据
        const selections = [];
        // 存储自定义选择器实例
        const customSelects = {};

        // 类型到标签的映射
        const typeLabels = {
            '省': '省份', '直辖市': '直辖市', '自治区': '自治区', '特别行政区': '特别行政区',
            '地级市': '城市', '自治州': '自治州', '盟': '盟', '地区': '地区',
            '市辖区': '区', '县': '县', '县级市': '县级市', '自治县': '自治县',
            '旗': '旗', '自治旗': '自治旗', '林区': '林区', '特区': '特区',
            '街道': '街道', '镇': '镇', '乡': '乡', '民族乡': '民族乡',
            '苏木': '苏木', '民族苏木': '民族苏木', '区公所': '区公所',
            '团': '团', '农场': '农场', '牧场': '牧场'
        };

        function getTypeLabel(type) {
            return typeLabels[type] || type || '下一级';
        }

        // 层级回退标签：源数据部分层级（乡级）无 type 字段，按 level 重述
        const levelFallbackLabels = { 1: '省级', 2: '地级', 3: '县级', 4: '乡级' };

        // 自定义可搜索选择器类
        class CustomSelect {
            constructor(container, options = {}) {
                this.container = container;
                this.options = [];
                this.filteredOptions = [];
                this.selectedValue = '';
                this.selectedText = '';
                this.selectedData = null;
                this.highlightedIndex = -1;
                this.isOpen = false;
                this.isLoading = true;
                this.placeholder = options.placeholder || '请选择';
                this.onChange = options.onChange || (() => {});
                this.level = options.level || 0;

                this.render();
                this.bindEvents();
            }

            render() {
                this.container.innerHTML = `
                    <div class="custom-select" id="custom-select-${this.level}">
                        <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                            <span class="custom-select-value custom-select-placeholder">${this.placeholder}</span>
                            <span class="custom-select-arrow">
                                <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                            </span>
                        </button>
                        <div class="custom-select-dropdown" role="listbox">
                            <div class="custom-select-search">
                                <input type="text" class="custom-select-search-input" placeholder="搜索..." autocomplete="off">
                            </div>
                            <div class="custom-select-options"></div>
                        </div>
                    </div>
                `;

                this.selectEl = this.container.querySelector('.custom-select');
                this.trigger = this.container.querySelector('.custom-select-trigger');
                this.valueDisplay = this.container.querySelector('.custom-select-value');
                this.dropdown = this.container.querySelector('.custom-select-dropdown');
                this.searchInput = this.container.querySelector('.custom-select-search-input');
                this.optionsContainer = this.container.querySelector('.custom-select-options');

                // 初始显示 loading 状态
                this.showLoading();
            }

            bindEvents() {
                // 点击触发器打开/关闭下拉
                this.trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.toggle();
                });

                // 搜索输入
                this.searchInput.addEventListener('input', () => {
                    this.filterOptions(this.searchInput.value);
                });

                // 键盘导航
                this.searchInput.addEventListener('keydown', (e) => {
                    this.handleKeydown(e);
                });

                this.trigger.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.toggle();
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.open();
                    }
                });

                // 点击外部关闭
                document.addEventListener('click', (e) => {
                    if (!this.container.contains(e.target)) {
                        this.close();
                    }
                });
            }

            handleKeydown(e) {
                switch (e.key) {
                    case 'ArrowDown':
                        e.preventDefault();
                        this.highlightNext();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        this.highlightPrev();
                        break;
                    case 'Enter':
                        e.preventDefault();
                        if (this.highlightedIndex >= 0 && this.filteredOptions[this.highlightedIndex]) {
                            this.selectOption(this.filteredOptions[this.highlightedIndex]);
                        }
                        break;
                    case 'Escape':
                        e.preventDefault();
                        this.close();
                        break;
                }
            }

            highlightNext() {
                if (this.filteredOptions.length === 0) return;
                this.highlightedIndex = Math.min(this.highlightedIndex + 1, this.filteredOptions.length - 1);
                this.updateHighlight();
            }

            highlightPrev() {
                if (this.filteredOptions.length === 0) return;
                this.highlightedIndex = Math.max(this.highlightedIndex - 1, 0);
                this.updateHighlight();
            }

            updateHighlight() {
                const options = this.optionsContainer.querySelectorAll('.custom-select-option');
                options.forEach((el, index) => {
                    el.classList.toggle('highlighted', index === this.highlightedIndex);
                });
                // 滚动到高亮选项
                if (this.highlightedIndex >= 0 && options[this.highlightedIndex]) {
                    options[this.highlightedIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            setOptions(options) {
                this.options = options;
                this.filteredOptions = [...options];
                this.isLoading = false;
                this.trigger.classList.remove('loading');
                this.renderOptions();
            }

            showLoading() {
                this.isLoading = true;
                this.trigger.classList.add('loading');
                this.optionsContainer.innerHTML = `
                    <div class="custom-select-loading">
                        <div class="custom-select-loading-spinner"></div>
                        <div class="custom-select-loading-text">加载中...</div>
                    </div>
                `;
            }

            hideLoading() {
                this.isLoading = false;
                this.trigger.classList.remove('loading');
            }

            filterOptions(query) {
                const searchTerm = query.toLowerCase().trim();
                if (!searchTerm) {
                    this.filteredOptions = [...this.options];
                } else {
                    this.filteredOptions = this.options.filter(opt =>
                        opt.name.toLowerCase().includes(searchTerm) ||
                        (opt.type && opt.type.toLowerCase().includes(searchTerm)) ||
                        opt.code.includes(searchTerm)
                    );
                }
                this.highlightedIndex = this.filteredOptions.length > 0 ? 0 : -1;
                this.renderOptions(searchTerm);
            }

            highlightText(text, query) {
                if (!query) return text;
                const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return text.replace(regex, '<span class="search-highlight">$1</span>');
            }

            renderOptions(searchTerm = '') {
                if (this.filteredOptions.length === 0) {
                    this.optionsContainer.innerHTML = `
                        <div class="custom-select-empty">
                            <div class="custom-select-empty-icon">🔍</div>
                            <div>未找到匹配项</div>
                        </div>
                    `;
                    return;
                }

                this.optionsContainer.innerHTML = this.filteredOptions.map((opt, index) => {
                    const isSelected = opt.code === this.selectedValue;
                    const isHighlighted = index === this.highlightedIndex;
                    const displayName = this.highlightText(opt.name, searchTerm);
                    return `
                        <div class="custom-select-option ${isSelected ? 'selected' : ''} ${isHighlighted ? 'highlighted' : ''}"
                             data-value="${opt.code}"
                             data-name="${opt.name}"
                             data-type="${opt.type || ''}"
                             role="option"
                             aria-selected="${isSelected}">
                            <span class="custom-select-option-name">${displayName}</span>
                            ${opt.type ? `<span class="custom-select-option-type">${opt.type}</span>` : ''}
                        </div>
                    `;
                }).join('');

                // 绑定选项点击事件
                this.optionsContainer.querySelectorAll('.custom-select-option').forEach((el, index) => {
                    el.addEventListener('click', () => {
                        this.selectOption(this.filteredOptions[index]);
                    });
                    el.addEventListener('mouseenter', () => {
                        this.highlightedIndex = index;
                        this.updateHighlight();
                    });
                });
            }

            selectOption(option) {
                this.selectedValue = option.code;
                this.selectedText = option.name;
                this.selectedData = option;

                this.valueDisplay.textContent = option.name;
                this.valueDisplay.classList.remove('custom-select-placeholder');

                this.close();
                this.onChange(option);
            }

            open() {
                if (this.isOpen) return;
                this.isOpen = true;
                this.selectEl.classList.add('open');
                this.trigger.setAttribute('aria-expanded', 'true');
                this.searchInput.value = '';
                this.filterOptions('');

                // 延迟聚焦搜索框，确保下拉动画完成
                setTimeout(() => {
                    this.searchInput.focus();
                }, 50);
            }

            close() {
                if (!this.isOpen) return;
                this.isOpen = false;
                this.selectEl.classList.remove('open');
                this.trigger.setAttribute('aria-expanded', 'false');
                this.highlightedIndex = -1;
            }

            toggle() {
                if (this.isOpen) {
                    this.close();
                } else {
                    this.open();
                }
            }

            reset() {
                this.selectedValue = '';
                this.selectedText = '';
                this.selectedData = null;
                this.valueDisplay.textContent = this.placeholder;
                this.valueDisplay.classList.add('custom-select-placeholder');
            }

            destroy() {
                this.container.innerHTML = '';
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            createSelector(0, '省级');
            loadProvinces();
            loadStats();
            setupCopyButton();
        });

        // 设置复制按钮
        function setupCopyButton() {
            const copyBtn = document.getElementById('copyBtn');
            const defaultHtml = `
                <svg viewBox="0 0 24 24">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
                <span>复制</span>
            `;
            copyBtn.innerHTML = defaultHtml;
            copyBtn.addEventListener('click', async function() {
                const code = document.getElementById('resultCode').textContent;
                try {
                    await navigator.clipboard.writeText(code);
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M20 6 9 17l-5-5"/>
                        </svg>
                        <span>已复制</span>
                    `;
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = defaultHtml;
                    }, 2000);
                } catch (err) {
                    console.error('复制失败:', err);
                }
            });
        }

        // 创建选择器
        function createSelector(level, label) {
            const container = document.getElementById('selectorContainer');

            const wrapper = document.createElement('div');
            wrapper.className = 'select-wrapper';
            wrapper.id = `wrapper-${level}`;
            wrapper.style.animationDelay = `${level * 0.1}s`;

            const labelEl = document.createElement('label');
            labelEl.id = `label-${level}`;
            labelEl.textContent = label;

            const selectContainer = document.createElement('div');
            selectContainer.className = 'select-container';
            selectContainer.id = `select-container-${level}`;

            wrapper.appendChild(labelEl);
            wrapper.appendChild(selectContainer);
            container.appendChild(wrapper);

            // 创建自定义选择器
            const customSelect = new CustomSelect(selectContainer, {
                placeholder: `请选择${label}`,
                level: level,
                onChange: (option) => onSelectionChange(level, option)
            });

            customSelects[level] = customSelect;
            return customSelect;
        }

        // 移除指定级别之后的所有选择器
        function removeSelectorsAfter(level) {
            const container = document.getElementById('selectorContainer');
            const wrappers = container.querySelectorAll('.select-wrapper');
            wrappers.forEach(wrapper => {
                const wrapperLevel = parseInt(wrapper.id.split('-')[1]);
                if (wrapperLevel > level) {
                    // 销毁自定义选择器实例
                    if (customSelects[wrapperLevel]) {
                        customSelects[wrapperLevel].destroy();
                        delete customSelects[wrapperLevel];
                    }
                    wrapper.remove();
                }
            });
            selections.length = level + 1;
        }

        // 加载省份
        async function loadProvinces() {
            try {
                const response = await fetch('/api/provinces');
                const data = await response.json();

                if (customSelects[0]) {
                    customSelects[0].setOptions(data.map(item => ({
                        code: item.code,
                        name: item.name,
                        type: item.type,
                        level: 1
                    })));
                }
            } catch (error) {
                console.error('加载省份失败:', error);
            }
        }

        // 选择变化处理
        async function onSelectionChange(level, option) {
            removeSelectorsAfter(level);

            if (!option || !option.code) {
                updateResult();
                return;
            }

            selections[level] = {
                code: option.code,
                name: option.name,
                type: option.type || '',
                dataLevel: option.level
            };

            await loadNextLevel(level, option.code);
            updateResult();
        }

        // 加载下一级数据
        async function loadNextLevel(currentLevel, parentCode) {
            try {
                const response = await fetch(`/api/children/${parentCode}`);
                const data = await response.json();

                if (!data.hasChildren || data.count === 0) {
                    return;
                }

                const nextLabel = getTypeLabel(data.childrenTypeName);
                const nextLevel = currentLevel + 1;

                const customSelect = createSelector(nextLevel, nextLabel);

                customSelect.setOptions(data.items.map(item => ({
                    code: item.code,
                    name: item.name,
                    type: item.type,
                    level: item.level
                })));

            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        // 更新结果面板
        function updateResult() {
            const panel = document.getElementById('resultPanel');
            const pathContainer = document.getElementById('resultPath');
            const codeEl = document.getElementById('resultCode');

            const validSelections = selections.filter(s => s && s.code);

            if (validSelections.length === 0) {
                panel.style.display = 'none';
                return;
            }

            panel.style.display = 'block';

            const arrowSvg = '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
            let pathHtml = '';
            validSelections.forEach((item, index) => {
                if (index > 0) {
                    pathHtml += `<span class="path-arrow">${arrowSvg}</span>`;
                }
                pathHtml += `
                    <span class="path-entry" style="animation-delay: ${index * 0.08}s">
                        <span class="path-name">${item.name}</span>
                        ${(item.type || levelFallbackLabels[item.dataLevel]) ? `<span class="type-tag">${item.type || levelFallbackLabels[item.dataLevel]}</span>` : ''}
                    </span>
                `;
            });

            pathContainer.innerHTML = pathHtml;

            const lastSelection = validSelections[validSelections.length - 1];
            codeEl.textContent = lastSelection.code;
        }

        // 加载统计信息
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('statTotal').textContent = data.total.toLocaleString();

                const levelMap = {};
                data.by_level.forEach(item => {
                    levelMap[item.level] = item.count;
                });

                document.getElementById('statLevel1').textContent = (levelMap[1] || 0).toLocaleString();
                document.getElementById('statLevel2').textContent = (levelMap[2] || 0).toLocaleString();
                document.getElementById('statLevel3').textContent = (levelMap[3] || 0).toLocaleString();
                document.getElementById('statLevel4').textContent = (levelMap[4] || 0).toLocaleString();

            } catch (error) {
                console.error('加载统计信息失败:', error);
            }
        }
    </script>
</body>

</html>
